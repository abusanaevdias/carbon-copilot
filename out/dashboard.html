:root{--bg:#FAFAF7;--ink:#14181F;--mut:#5A606B;--mut2:#8A8F98;--rule:#E2E4E7;--rule2:#C9CCD1;--acc:#B4372B;--fill:#F1F1EC}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:400 13px/1.4 Onest,"Segoe UI",Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
header{height:52px;display:flex;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid var(--ink)}
header h1{font-size:15px;font-weight:700;margin:0}
header .meta{color:var(--mut);font-size:12px;flex:1}
.seg{display:flex;border:1px solid var(--rule2)}
.seg button{padding:5px 10px;font-size:12px;border-left:1px solid var(--rule2)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink);color:var(--bg)}
main{display:grid;grid-template-columns:290px 1fr 450px;height:calc(100vh - 52px);min-height:660px}
.col{padding:14px 20px;overflow:auto;border-right:1px solid var(--rule)}
.col:last-child{border-right:0;background:#fff}
h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between}
h2 span{text-transform:none;letter-spacing:0;font-weight:400}
.total .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.total .v{font-size:46px;font-weight:800;line-height:1;letter-spacing:-.02em;margin:4px 0 2px}
.total .u{margin-left:6px;font-size:15px;font-weight:600;color:var(--mut)}
.total .s{font-size:12px;color:var(--mut)}
.scopes{margin:14px 0 14px;border-top:1px solid var(--ink)}
.scope{display:grid;grid-template-columns:1fr auto;width:100%;padding:7px 4px;border-bottom:1px solid var(--rule)}
.scope:hover{background:var(--fill)}
.scope.on{background:var(--ink);color:var(--bg)}
.scope.on .d{color:var(--rule2)}
.scope .n{font-size:22px;font-weight:700;text-align:right}
.scope .d{font-size:11.5px;color:var(--mut);grid-column:1/3}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12.5px;margin-bottom:12px}
.kv .r{text-align:right;font-weight:600}
.split{display:flex;height:6px;margin:4px 0 6px}
.split b{background:var(--ink)}.split i{background:var(--rule2)}
.bars{margin-bottom:14px}
.bar{display:grid;grid-template-columns:250px 1fr 64px 46px;gap:8px;align-items:center;width:100%;padding:4px 4px;border-bottom:1px solid var(--rule)}
.bar:hover{background:var(--fill)}
.bar.on{outline:2px solid var(--ink);outline-offset:-2px}
.bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .nm small{color:var(--mut2);margin-left:4px}
.bar .tr{height:12px;background:var(--fill)}
.bar .tr i{display:block;height:100%;background:var(--mut2);min-width:2px}
.bar.hot .tr i{background:var(--acc)}
.bar .v{text-align:right;font-weight:600}
.bar .p{text-align:right;color:var(--mut);font-size:12px}
.bars.f .bar{padding:3px 4px}
.tabs{display:flex;gap:16px;border-bottom:1px solid var(--ink);margin-bottom:8px}
.tabs button{padding:4px 0 6px;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.crumb{font-size:12px;color:var(--mut);margin-bottom:8px}
.crumb button{text-decoration:underline;text-underline-offset:2px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:4px 4px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--mut);font-size:11px}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:700;border-top:1px solid var(--ink)}
.ln{display:grid;grid-template-columns:58px 1fr 64px 16px;gap:8px;width:100%;padding:4px 2px;border-bottom:1px solid var(--rule);font-size:12px}
.ln:hover{background:var(--fill)}
.ln .ds{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .t{text-align:right;font-weight:600}
.ln .q{color:var(--mut)}
.fl{color:var(--acc);font-size:11px;font-weight:600}
.dl{display:grid;grid-template-columns:118px 1fr;gap:3px 10px;font-size:12.5px;margin:0 0 10px}
.dl dt{color:var(--mut)}.dl dd{margin:0;word-break:break-word}
.formula{border-top:2px solid var(--ink);border-bottom:1px solid var(--rule2);padding:8px 0;margin:6px 0 10px;font-size:13.5px}
.formula .eq{font-size:17px;font-weight:700;margin-top:3px}
.formula .ok{font-size:12px;color:var(--mut);margin-top:3px}
.note{font-size:12px;color:var(--mut);margin:6px 0}
.warn{border-left:3px solid var(--acc);padding:4px 0 4px 8px;margin:6px 0;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin:4px 0 8px}
.chips b{font-weight:700}
</style></head>

<script>
"use strict";
var D = JSON.parse(document.getElementById("data").textContent);
var C = D.cols, LINES = D.lines.map(function (r) { var o = {}; C.forEach(function (k, i) { o[k] = r[i]; }); return o; });
var BY_ID = {}; LINES.forEach(function (l) { BY_ID[l.line_id] = l; });
var REVIEW = ["new_wording", "injection", "spend_fallback", "unit_alias", "outlier"];
var S = {split: "all", scope: "", cat: "", ef: "", line: "", tab: "quality"};

function h(t, a) {
  var e = document.createElement(t);
  for (var k in (a || {})) {
    if (k === "on") e.addEventListener("click", a[k]);
    else if (k === "cls") e.className = a[k];
    else if (k === "style") e.style.cssText = a[k];
    else e.setAttribute(k, a[k]);
  }
  for (var i = 2; i < arguments.length; i++) add(e, arguments[i]);
  return e;
}
function add(e, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(function (x) { add(e, x); }); return; }
  e.append(c.nodeType ? c : document.createTextNode(String(c)));   // text only: ledger text never becomes markup
}
function fmt(x, d) { return Number(x).toLocaleString("en-US", {minimumFractionDigits: d || 0, maximumFractionDigits: d || 0}); }
function sig(x) { return Number(x).toLocaleString("en-US", {maximumSignificantDigits: 6}); }
function pct(x, t) { return t ? (100 * x / t).toFixed(1) + "%" : "0%"; }
function sum(a, f) { return a.reduce(function (s, x) { return s + f(x); }, 0); }
function flagsOf(l) { return l.flags ? l.flags.split("|") : []; }
function inQueue(l) { return flagsOf(l).some(function (f) { return REVIEW.indexOf(f) >= 0; }); }
function base() { return LINES.filter(function (l) { return S.split === "all" || l.split === S.split; }); }
function included(a) { return a.filter(function (l) { return l.method !== "excluded"; }); }
function catName(c) { return D.cats[c] || c; }
function go(p) { for (var k in p) S[k] = p[k]; render(); }

function render() {
  var parts = [];
  ["split", "scope", "cat", "ef", "line", "tab"].forEach(function (k) { if (S[k] && !(k === "split" && S[k] === "all")) parts.push(k + "=" + encodeURIComponent(S[k])); });
  history.replaceState(null, "", "#" + parts.join("&"));
  var all = base(), inc = included(all);
  renderHeader(all); renderC1(inc, all); renderC2(inc); renderC3(inc, all);
}

function renderHeader(all) {
  var m = D.inv.meta, sp = document.getElementById("splits");
  document.getElementById("meta").replaceChildren(m.entity + " · " + m.year + " · " + fmt(all.length) + " ledger lines · names masked · generated " + m.generated_at);
  var opts = [["all", "All lines"], ["train", "Train (labelled)"], ["test", "Test (predicted)"]];
  if (LINES.some(function (l) { return l.split === "new"; })) opts.push(["new", "New lines"]);
  sp.replaceChildren.apply(sp, opts.map(function (o) {
    return h("button", {cls: S.split === o[0] ? "on" : "", on: function () { go({split: o[0], line: ""}); }}, o[1]);
  }));
}

function renderC1(inc, all) {
  var tot = sum(inc, function (l) { return l.tco2e; });
  var milk = sum(inc.filter(function (l) { return l.ef_id === "EF_MILK_KG"; }), function (l) { return l.tco2e; });
  var sn = D.inv.sensitivity.change_pct / 100;
  var act = inc.filter(function (l) { return l.method === "activity"; }), absT = sum(inc, function (l) { return Math.abs(l.tco2e); }) || 1;
  var actP = 100 * sum(act, function (l) { return Math.abs(l.tco2e); }) / absT;
  var scopes = ["1", "2", "3"].map(function (s) {
    var ls = inc.filter(function (l) { return l.scope === s; }), t = sum(ls, function (l) { return l.tco2e; });
    var desc = {"1": "fuel, own fleet, refrigerant leaks", "2": "electricity and heat, location-based", "3": "purchased goods, capital, transport, waste, travel"}[s];
    return h("button", {cls: "scope" + (S.scope === s ? " on" : ""), "data-scope": s,
      on: function () { go(S.scope === s ? {scope: "", cat: "", ef: "", line: "", tab: "quality"} : {scope: s, cat: "", ef: "", line: "", tab: "lines"}); }},
      h("span", null, h("b", null, "Scope " + s), " · " + pct(t, tot)), h("span", {cls: "n num"}, fmt(t)),
      h("span", {cls: "d"}, desc + " · " + ls.length + " lines"));
  });
  var q = all.filter(inQueue);
  document.getElementById("c1").replaceChildren(
    h("div", {cls: "total"}, h("div", {cls: "l"}, "Total " + D.inv.meta.year + ", Scope 1+2+3"),
      h("div", {cls: "v num", id: "total"}, fmt(tot), h("span", {cls: "u"}, " tCO2e")),
      h("div", {cls: "s num"}, "Sensitivity: milk factor −" + (sn * 100) + "% to +" + (sn * 100) + "% gives " + fmt(tot - sn * milk) + " – " + fmt(tot + sn * milk))),
    h("div", {cls: "scopes"}, scopes),
    h("h2", null, "How it was computed"),
    h("div", {cls: "split"}, h("b", {style: "width:" + actP.toFixed(1) + "%"}), h("i", {style: "width:" + (100 - actP).toFixed(1) + "%"})),
    h("div", {cls: "kv num"},
      h("span", null, "Activity data, " + act.length + " lines"), h("span", {cls: "r"}, actP.toFixed(1) + "% of t"),
      h("span", null, "Spend-based, " + (inc.length - act.length) + " lines"), h("span", {cls: "r"}, (100 - actP).toFixed(1) + "% of t"),
      h("span", null, "Excluded at 0 t"), h("span", {cls: "r"}, all.length - inc.length + " lines")),
    h("h2", null, "Intensity"),
    h("div", {cls: "kv num"}, h("span", null, "tCO2e per t of product (" + fmt(D.inv.intensity.product_t) + " t)"),
      h("span", {cls: "r"}, (tot / D.inv.intensity.product_t).toFixed(2))),
    h("button", {cls: "warn", style: "width:100%", on: function () { go({tab: "queue", line: ""}); }},
      h("b", null, q.length + " lines to review"), " · " + pct(sum(q, function (l) { return Math.abs(l.tco2e); }), absT) + " of tCO2e · open queue"));
}

function bars(rows, cls, onClick, isOn, tot) {
  var mx = Math.max.apply(null, rows.map(function (r) { return Math.abs(r.t); }).concat([1e-9]));
  return h("div", {cls: "bars " + cls}, rows.map(function (r, i) {
    return h("button", {cls: "bar" + (i === 0 && r.t > 0 ? " hot" : "") + (isOn(r) ? " on" : ""), "data-key": r.key, on: function () { onClick(r); }},
      h("span", {cls: "nm", title: r.name + " " + r.key}, r.name, r.code ? h("small", null, r.code) : null),
      h("span", {cls: "tr"}, h("i", {style: "width:" + (100 * Math.abs(r.t) / mx).toFixed(2) + "%"})),
      h("span", {cls: "v num"}, fmt(r.t)), h("span", {cls: "p num"}, pct(r.t, tot)));
  }));
}

function renderC2(inc) {
  var sc = inc.filter(function (l) { return !S.scope || l.scope === S.scope; });
  var cats = D.inv.by_category.filter(function (c) { return !S.scope || c.scope === S.scope; }).map(function (c) {
    var ls = sc.filter(function (l) { return l.category === c.category; });
    return {key: c.category, name: c.name, code: "S" + c.scope + " · " + ls.length, t: sum(ls, function (l) { return l.tco2e; })};
  }).sort(function (a, b) { return b.t - a.t; });
  var fsrc = sc.filter(function (l) { return !S.cat || l.category === S.cat; }), fm = {};
  fsrc.forEach(function (l) { fm[l.ef_id] = (fm[l.ef_id] || 0) + l.tco2e; });
  var facs = Object.keys(fm).map(function (e) { return {key: e, name: D.ef[e] || e, code: "", t: fm[e]}; })
    .sort(function (a, b) { return b.t - a.t; }).slice(0, 8);
  document.getElementById("c2").replaceChildren(
    h("h2", null, "Emissions by category, tCO2e", h("span", null, S.scope ? "share of Scope " + S.scope : "share of total")),
    bars(cats, "c", function (r) { go({cat: S.cat === r.key ? "" : r.key, ef: "", line: "", tab: "lines"}); }, function (r) { return r.key === S.cat; }, sum(sc, function (l) { return l.tco2e; })),
    h("h2", null, "Top 8 emission factors, tCO2e", h("span", null, "share of " + (S.cat ? catName(S.cat) : (S.scope ? "Scope " + S.scope : "total")))),
    bars(facs, "f", function (r) { go({ef: S.ef === r.key ? "" : r.key, line: "", tab: "lines"}); }, function (r) { return r.key === S.ef; }, sum(fsrc, function (l) { return l.tco2e; })));
}

function crumb() {
  var c = [h("button", {on: function () { go({scope: "", cat: "", ef: "", line: ""}); }}, "All")];
  if (S.scope) c.push(" › ", h("button", {on: function () { go({cat: "", ef: "", line: ""}); }}, "Scope " + S.scope));
  if (S.cat) c.push(" › ", h("button", {on: function () { go({ef: "", line: ""}); }}, catName(S.cat)));
  if (S.ef) c.push(" › ", h("button", {on: function () { go({line: ""}); }}, S.ef));
  if (S.line) c.push(" › " + S.line);
  return h("div", {cls: "crumb"}, c);
}

function lineList(ls, limit) {
  ls = ls.slice().sort(function (a, b) { return Math.abs(b.tco2e) - Math.abs(a.tco2e); });
  var out = ls.slice(0, limit || 250).map(function (l) {
    var fl = flagsOf(l).filter(function (f) { return REVIEW.indexOf(f) >= 0; });
    return h("button", {cls: "ln", "data-line": l.line_id, on: function () { go({line: l.line_id, tab: "lines"}); }},
      h("span", {cls: "num"}, l.line_id), h("span", {cls: "ds", title: l.description}, fl.length ? h("span", {cls: "fl"}, fl.join(", ") + " · ") : null, l.description),
      h("span", {cls: "t num"}, fmt(l.tco2e, 1)), h("span", {cls: "q"}, l.quality));
  });
  if (ls.length > out.length) out.push(h("div", {cls: "note"}, "Showing the " + out.length + " largest of " + ls.length + " lines. Narrow by category or factor."));
  return out;
}

function lineDetail(l) {
  var spend = l.method === "spend", baseQ = spend ? l.net_kzt : l.quantity, baseU = spend ? "KZT net" : l.unit;
  var conv = baseQ ? l.activity_qty / baseQ : 0, re = l.activity_qty * l.ef_value / 1000;
  var note = (l.reason.split("; ").slice(-1)[0] || "");
  var fl = flagsOf(l);
  var f = l.method === "excluded" ? h("div", {cls: "formula"}, h("div", {cls: "eq"}, "Excluded: 0 tCO2e"), h("div", {cls: "ok"}, l.reason)) :
    h("div", {cls: "formula num"},
      h("div", null, "quantity × conversion × factor ÷ 1000 = tCO2e"),
      h("div", {cls: "eq"}, sig(baseQ) + " " + baseU + " × " + sig(conv) + " × " + sig(l.ef_value) + " ÷ 1000 = " + fmt(re, 4) + " tCO2e"),
      h("div", {cls: "ok"}, "Conversion: " + sig(baseQ) + " " + baseU + " → " + sig(l.activity_qty) + " " + l.activity_unit + " (" + note + "). Factor " + l.ef_id + " = " + l.ef_value + " kgCO2e per " + l.ef_unit + ". " +
        (Math.abs(re - l.tco2e) < 0.001 ? "Matches the audit file (" + fmt(l.tco2e, 4) + ")." : "Audit file says " + fmt(l.tco2e, 4) + ".")));
  return [
    h("dl", {cls: "dl"},
      h("dt", null, "Line"), h("dd", null, l.line_id + " · " + l.split + " · " + l.posting_date),
      h("dt", null, "Document"), h("dd", null, l.doc_no),
      h("dt", null, "Counterparty"), h("dd", null, l.counterparty + " (masked)"),
      h("dt", null, "Description"), h("dd", null, l.description),
      h("dt", null, "GL account"), h("dd", null, l.gl_account),
      h("dt", null, "Quantity"), h("dd", {cls: "num"}, sig(l.quantity) + " " + l.unit + " · net " + fmt(l.net_kzt) + " KZT"),
      h("dt", null, "Category"), h("dd", null, catName(l.category) + " (" + l.category + ")"),
      h("dt", null, "Factor"), h("dd", null, l.ef_id ? l.ef_id + ", " + (D.ef[l.ef_id] || "") + ": " + l.ef_value + " kgCO2e/" + l.ef_unit : "none"),
      h("dt", null, "Method · tier"), h("dd", null, l.method + " · " + l.quality),
      h("dt", null, "Reason"), h("dd", null, l.reason),
      fl.length ? [h("dt", null, "Flags"), h("dd", null, fl.map(function (f) { return h("span", {cls: REVIEW.indexOf(f) >= 0 ? "fl" : ""}, f + " "); }))] : null),
    f];
}

function qualityTable(inc) {
  var tot = sum(inc, function (l) { return Math.abs(l.tco2e); }) || 1;
  var rows = D.inv.by_category.filter(function (c) { return !S.scope || c.scope === S.scope; }).map(function (c) {
    var ls = inc.filter(function (l) { return l.category === c.category; });
    return h("tr", null, h("td", null, c.name), ["A", "B", "C"].map(function (q) {
      var x = ls.filter(function (l) { return l.quality === q; });
      return h("td", {cls: "r"}, x.length ? fmt(sum(x, function (l) { return l.tco2e; })) + " / " + x.length : "–");
    }));
  });
  var sh = ["A", "B", "C"].map(function (q) {
    var x = inc.filter(function (l) { return l.quality === q; });
    return h("td", {cls: "r"}, (100 * sum(x, function (l) { return Math.abs(l.tco2e); }) / tot).toFixed(1) + "% / " + x.length);
  });
  return [h("table", null,
    h("tr", null, h("th", null, "Category"), h("th", {cls: "r"}, "A t / lines"), h("th", {cls: "r"}, "B t / lines"), h("th", {cls: "r"}, "C t / lines")),
    rows, h("tr", {cls: "tot"}, h("td", null, "Share of tCO2e / lines"), sh)),
    h("p", {cls: "note"}, "A: " + D.inv.quality.definition.A + ". B: " + D.inv.quality.definition.B + ". C: " + D.inv.quality.definition.C + ". Our tiers, after the GHG Protocol Scope 3 data-quality idea; not a PCAF score.")];
}

function renderC3(inc, all) {
  var q = all.filter(inQueue), body;
  var tabs = h("div", {cls: "tabs"}, [["lines", "Lines"], ["queue", "Review queue (" + q.length + ")"], ["quality", "Data quality"]].map(function (t) {
    return h("button", {cls: S.tab === t[0] ? "on" : "", on: function () { go({tab: t[0]}); }}, t[1]);
  }));
  if (S.tab === "lines" && S.line && BY_ID[S.line]) body = [crumb(), lineDetail(BY_ID[S.line])];
  else if (S.tab === "lines") {
    var ls = all.filter(function (l) { return (!S.scope || l.scope === S.scope) && (!S.cat || l.category === S.cat) && (!S.ef || l.ef_id === S.ef); });
    if (!S.scope && !S.cat && !S.ef) ls = inc;
    body = [crumb(), h("div", {cls: "note num"}, ls.length + " lines · " + fmt(sum(ls, function (l) { return l.tco2e; }), 1) + " tCO2e · click a line for its formula"), lineList(ls)];
  } else if (S.tab === "queue") {
    var by = {}; q.forEach(function (l) { flagsOf(l).forEach(function (f) { if (REVIEW.indexOf(f) >= 0) by[f] = (by[f] || 0) + 1; }); });
    var absT = sum(included(all), function (l) { return Math.abs(l.tco2e); }) || 1;
    body = [h("div", {cls: "note num"}, q.length + " of " + all.length + " lines flagged · " + pct(sum(q, function (l) { return Math.abs(l.tco2e); }), absT) + " of tCO2e. Flags never change a result; a person confirms each line."),
      h("div", {cls: "chips"}, REVIEW.map(function (f) { return h("span", null, h("b", null, String(by[f] || 0)), " " + f); })), lineList(q)];
  } else body = qualityTable(inc);
  var c3 = document.getElementById("c3"); c3.replaceChildren(); add(c3, [tabs, body]);
}

(function init() {
  location.hash.slice(1).split("&").forEach(function (kv) { var p = kv.split("="); if (p[0] in S && p[1]) S[p[0]] = decodeURIComponent(p[1]); });
  if (S.line && !S.tab) S.tab = "lines";
  render();
})();
</script>
</body></html>
