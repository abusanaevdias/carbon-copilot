<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Carbon Copilot</title>
<!-- Template v2: deck/build.py generates every slide into the SLIDES marker from out/*.json|csv and writes _deck_render.html -> deck.pdf.
     Classes the lint reads: .ann = annotation (max 2), .foot = footer line, .x = exhibit label (not counted as body, max 6 words each). -->
<style>
@font-face{font-family:Onest;font-weight:100 900;src:url(assets/fonts/onest-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Onest;font-weight:100 900;src:url(assets/fonts/onest-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Onest;font-weight:100 900;src:url(assets/fonts/onest-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Onest;font-weight:100 900;src:url(assets/fonts/onest-cyrillic-ext.woff2) format('woff2');unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F}
@page{size:1280px 720px;margin:0}
:root{--bg:#FAFAF7;--ink:#14181F;--mid:#5B616B;--soft:#9AA0A8;--rule:#DADCD6;--acc:#B4372B;--tint:#F0EFEA;--grey:#8A9099}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Onest,"Segoe UI",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-print-color-adjust:exact;print-color-adjust:exact}
section{width:1280px;height:720px;padding:30px 72px 66px;position:relative;overflow:hidden;page-break-after:always;break-after:page;display:flex;flex-direction:column}
section:last-of-type{page-break-after:auto;break-after:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.k{font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);display:flex;align-items:center;gap:10px}
.k:before{content:"";width:10px;height:10px;background:var(--acc)}
.brand{font-size:15px;color:var(--mid)}.brand b{color:var(--ink)}
h1{font-size:36px;line-height:1.14;font-weight:700;letter-spacing:-.012em;max-width:1136px}
.ex{flex:1;margin-top:18px;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:center}
.ex svg{display:block;overflow:visible}
.ann{font-size:19px;line-height:1.3;color:var(--ink);border-left:3px solid var(--acc);padding-left:12px}
.bot{position:absolute;left:72px;right:72px;bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-top:1px solid var(--rule);padding-top:8px}
.foot{font-size:13px;line-height:1.35;color:var(--mid);max-width:640px}
.nav{font-size:13px;color:var(--soft);white-space:nowrap;letter-spacing:.01em}
.nav b{color:var(--ink);font-weight:700}
.pg{font-size:13px;color:var(--soft);margin-left:14px}
.fill{color:var(--acc);font-weight:700;background:#F6E3E0;padding:0 6px}
.mono{font-family:Consolas,"Cascadia Mono",monospace}
img{display:block}
#lint{display:none}
/*EXTRA_CSS*/
</style></head><body>
<!--SLIDES-->
<pre id="lint"></pre>
<script>
// Measures every slide for `build.py --lint`; read back through --dump-dom. Invisible in the PDF.
document.fonts.ready.then(() => {
  const words = t => (t.match(/\S+/g) || []).filter(w => /[A-Za-zА-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі]/.test(w));
  const out = [...document.querySelectorAll('section')].map((s, i) => {
    const sr = s.getBoundingClientRect(), h1 = s.querySelector('h1'), ex = s.querySelectorAll('.ex');
    const r = document.createRange(); r.selectNodeContents(h1);
    const lines = new Set([...r.getClientRects()].map(q => Math.round(q.top))).size;
    const c = s.cloneNode(true);
    c.querySelectorAll('.top,h1,.nav,.pg,.x,.fill,script').forEach(e => e.remove());
    const foot = c.querySelector('.foot'), footText = foot ? foot.textContent : '';
    c.querySelectorAll('.foot').forEach(e => e.remove());
    const body = c.textContent;
    const exr = ex.length ? ex[0].getBoundingClientRect() : {width: 0, height: 0, bottom: 0};
    let minFont = 99, minEl = '';
    const outside = [];
    if (ex.length) ex[0].querySelectorAll('*').forEach(e => {
      const own = [...e.childNodes].some(n => n.nodeType === 3 && n.textContent.trim());
      if (own) { const f = parseFloat(getComputedStyle(e).fontSize); if (f < minFont) { minFont = f; minEl = e.textContent.trim().slice(0, 40); } }
    });
    s.querySelectorAll('*').forEach(e => {
      const q = e.getBoundingClientRect();
      if (q.width && (q.left < sr.left - 1 || q.right > sr.right + 1 || q.top < sr.top - 1 || q.bottom > sr.bottom + 1))
        outside.push(e.tagName + ':' + e.textContent.trim().slice(0, 30));
    });
    const bot = s.querySelector('.bot'), botTop = bot ? bot.getBoundingClientRect().top : sr.bottom;
    let exContentBottom = 0;
    if (ex.length) ex[0].querySelectorAll('*').forEach(e => { const q = e.getBoundingClientRect(); if (q.height) exContentBottom = Math.max(exContentBottom, q.bottom); });
    const ht = h1.textContent;
    return {slide: i + 1, title: ht.trim().replace(/\s+/g, ' '), title_words: (ht.match(/\S+/g) || []).length,
            title_lines: lines, ex_count: ex.length, ex_w: Math.round(exr.width), ex_h: Math.round(exr.height),
            content_over_footer: Math.round(exContentBottom - botTop), body_words: words(body).length, foot_words: words(footText).length,
            ann: s.querySelectorAll('.ann').length, x_max_words: Math.max(0, ...[...s.querySelectorAll('.x')].map(e => words(e.textContent).length)),
            min_font_ex: minFont, min_font_el: minEl, outside: outside.slice(0, 5),
            text_ban: (() => { const b = s.cloneNode(true); b.querySelectorAll('.foot,script').forEach(e => e.remove()); return b.textContent.replace(/\s+/g, ' '); })(),
            text_all: s.textContent.replace(/\s+/g, ' ')};
  });
  document.getElementById('lint').textContent = JSON.stringify(out);
});
</script>
</body></html>
