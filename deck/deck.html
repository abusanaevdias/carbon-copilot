<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Carbon Copilot</title>
<!-- Template v5 (editorial report, eight compositions via data-layout: hero split flow eq trio table bar timeline): deck/build.py generates every slide into the SLIDES marker from out/*.json|csv and writes _deck_render.html -> deck.pdf. -->
<style>
@font-face{font-family:Onest;font-weight:100 900;src:url(assets/fonts/onest-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Onest;font-weight:100 900;src:url(assets/fonts/onest-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Onest;font-weight:100 900;src:url(assets/fonts/onest-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Onest;font-weight:100 900;src:url(assets/fonts/onest-cyrillic-ext.woff2) format('woff2');unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F}
@page{size:1280px 720px;margin:0}
:root{--bg:#F7F5F0;--ink:#14181F;--g1:#45474C;--g2:#5F6166;--g3:#8D8B85;--rule:#C9C6BE;--acc:#A3372B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Onest,"Segoe UI",Arial,sans-serif;font-weight:400;font-variant-numeric:tabular-nums;-webkit-print-color-adjust:exact;print-color-adjust:exact}
section{width:1280px;height:720px;position:relative;overflow:hidden;page-break-after:always;break-after:page;background:var(--bg)}
section:last-of-type{page-break-after:auto;break-after:auto}
.top{position:absolute;left:96px;right:96px;top:72px;height:30px;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.top .k{color:var(--ink);font-weight:600}.top .c{color:var(--g2)}
.grid{position:absolute;left:96px;right:96px;top:134px;bottom:108px;display:grid;grid-template-columns:repeat(12,1fr);column-gap:24px}
.grid>.lc{grid-column:1/span 5;display:flex;flex-direction:column;min-height:0}
.grid>.ex{grid-column:7/span 6;position:relative;display:flex;flex-direction:column;justify-content:center;min-height:0}
section.w7 .grid>.lc{grid-column:1/span 4}section.w7 .grid>.ex{grid-column:6/span 7}
/* v5: one absolute stage (x 96-1184, y 134-612); each composition places its blocks inside it */
.stage{position:absolute;left:96px;right:96px;top:134px;bottom:108px}
.stage .ex{position:absolute;left:0;right:0}
section[data-layout=hero] h1,section[data-layout=eq] h1{text-align:center;max-width:717px;margin:0 auto}
.hero{font-size:168px;font-weight:700;letter-spacing:-.04em;line-height:.95}
.lbl{font-size:14px;color:var(--g1);line-height:1.35}.sub{font-size:13px;color:var(--g2);line-height:1.35}
.hatch{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--g3) 5px 6px)!important;box-shadow:inset 0 0 0 1px var(--ink)}
h1{font-size:36px;font-weight:700;line-height:1.14;letter-spacing:-.015em}
.lead{font-size:18px;line-height:1.45;color:var(--g1);margin-top:22px}
.facts{margin-top:auto}
.ann{border-top:1px solid var(--rule);padding:9px 0 11px;font-size:15px;line-height:1.4;color:var(--g1)}
.ann b{color:var(--ink);font-weight:600}
.bot{position:absolute;left:96px;right:96px;top:637px;border-top:1px solid var(--rule);padding-top:12px;display:flex;justify-content:space-between;gap:40px;font-size:13px;line-height:1.35;color:var(--g2)}
.pg{white-space:nowrap}
.fill{color:var(--acc);font-weight:700;letter-spacing:.04em}
.mono{font-family:Consolas,"Cascadia Mono",monospace}
.cap{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--g2)}
.num{font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--ink)}
.num.acc{color:var(--acc)}.v,.val{font-weight:600}
/* bars: B1 style (label/value line, thin bar below) and B2 style (label | bar | value) */
.br{border-top:1px solid var(--rule);padding:12px 0 18px}
.br .l{display:flex;justify-content:space-between;font-size:15px;margin-bottom:10px}
.br .b{height:12px;background:var(--g3)}
.row{display:grid;grid-template-columns:var(--lw,200px) 1fr var(--vw,72px);align-items:center;column-gap:16px;height:var(--rh,46px);font-size:15px}
.row .t{height:12px;background:var(--g3)}
.row .v{text-align:right}
.lite{background:var(--rule)!important}.acc{color:var(--acc)}.bg-acc{background:var(--acc)!important}.bg-ink{background:var(--ink)!important}
img{display:block}
#lint{display:none}
</style></head><body>
<!--SLIDES-->
<pre id="lint"></pre>
<script>
// Measures every slide for `build.py --lint`; read back through --dump-dom. Invisible in the PDF.
// Classes: .lead = lead (<=18 words), .ann = supporting fact (<=2, <=10 words each), .foot = source line, .x = exhibit label (not body, <=7 words).
document.fonts.ready.then(() => {
  const words = t => (t.match(/\S+/g) || []).filter(w => /[A-Za-zА-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі]/.test(w));
  const out = [...document.querySelectorAll('section')].map((s, i) => {
    const sr = s.getBoundingClientRect(), h1 = s.querySelector('h1');
    const r = document.createRange(); r.selectNodeContents(h1);
    const lines = new Set([...r.getClientRects()].map(q => Math.round(q.top))).size;
    const c = s.cloneNode(true);
    c.querySelectorAll('.top,h1,.pg,.x,.fill,script,.foot').forEach(e => e.remove());
    const lead = s.querySelector('.lead');
    let minFont = 99, minEl = '';
    s.querySelectorAll('*').forEach(e => {
      const own = [...e.childNodes].some(n => n.nodeType === 3 && n.textContent.trim());
      if (own) { const f = parseFloat(getComputedStyle(e).fontSize); if (f < minFont) { minFont = f; minEl = e.textContent.trim().slice(0, 40); } }
    });
    const outside = [], spill = [];
    s.querySelectorAll('*').forEach(e => {
      const q = e.getBoundingClientRect();
      if (q.width && (q.left < sr.left - 1 || q.right > sr.right + 1 || q.top < sr.top - 1 || q.bottom > sr.bottom + 1))
        outside.push(e.tagName + ':' + e.textContent.trim().slice(0, 30));
    });
    s.querySelectorAll('.lc,.ex').forEach(col => {
      const cr = col.getBoundingClientRect();
      col.querySelectorAll('*').forEach(e => { const q = e.getBoundingClientRect();
        if (q.width && (q.right > cr.right + 1 || q.left < cr.left - 1 || q.bottom > cr.bottom + 1 || q.top < cr.top - 1))
          spill.push(col.className + '>' + e.tagName + ':' + e.textContent.trim().slice(0, 30)); });
    });
    const ht = h1.textContent, foot = s.querySelector('.foot');
    return {slide: i + 1, title: ht.trim().replace(/\s+/g, ' '), title_words: (ht.match(/\S+/g) || []).length,
            title_lines: lines, ex_count: s.querySelectorAll('.ex').length,
            layout: s.dataset.layout || '', kicker: s.querySelector('.top .k').textContent.trim(),
            has_table: !!s.querySelector('table,.tbl'),
            ex_w: Math.round(((s.querySelector('.ex') || s).getBoundingClientRect()).width),
            hero_n: [...s.querySelectorAll('*')].filter(e => parseFloat(getComputedStyle(e).fontSize) >= 100 && e.textContent.trim()
                      && !(e.parentElement && parseFloat(getComputedStyle(e.parentElement).fontSize) >= 100)).length,
            est_missing: [...s.querySelectorAll('.a')].filter(e => !/est\./.test((e.parentElement.textContent.split(e.textContent)[1] || ''))).map(e => e.textContent.trim()),
            lead_words: lead ? words(lead.textContent).length : 0, body_words: words(c.textContent).length,
            foot_words: foot ? words(foot.textContent).length : 0,
            ann: s.querySelectorAll('.ann').length, ann_max_words: Math.max(0, ...[...s.querySelectorAll('.ann')].map(e => words(e.textContent).length)), x_max_words: Math.max(0, ...[...s.querySelectorAll('.x')].map(e => words(e.textContent).length)),
            min_font: minFont, min_font_el: minEl, outside: outside.slice(0, 5), spill: spill.slice(0, 5),
            text_ban: (() => { const b = s.cloneNode(true); b.querySelectorAll('.foot,script').forEach(e => e.remove()); return b.textContent.replace(/\s+/g, ' '); })(),
            text_all: s.textContent.replace(/\s+/g, ' ')};
  });
  document.getElementById('lint').textContent = JSON.stringify(out);
});
</script>
</body></html>
